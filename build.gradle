buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.3.2'
    }
}
plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.2.21'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.2.21' apply false
}
allprojects {
    repositories {
        google()
        mavenCentral()
    }
}
